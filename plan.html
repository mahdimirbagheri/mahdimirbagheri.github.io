<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRUM DRAG & DROP TIMELINE</title>
    <style>
        :root {
            --bg-pure: #030303;
            --text-main: #eaeaea;
            --border-dim: #1a1a1a;
            --text-muted: #555555;
            
            /* طیف مینی‌مال هفت رنگ */
            --sat: #ff4a4a;
            --sun: #ff9800;
            --mon: #ffeb3b;
            --tue: #4caf50;
            --wed: #00bcd4;
            --thu: #3f51b5;
            --fri: #9c27b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            padding: 4rem 2rem 10rem 2rem;
            letter-spacing: -0.01em;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ساختار جدول */
        .timeline-table {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-dim);
            background: #080808;
        }

        .table-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            border-bottom: 1px solid var(--border-dim);
            position: relative;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        /* ستون روز */
        .day-column {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-left: 1px solid var(--border-dim);
            background: #0a0a0a;
            user-select: none;
        }

        .day-name {
            font-size: 1.3rem;
            font-weight: 600;
        }

        /* حاشیه‌های هفت‌رنگ */
        .table-row[data-day="sat"] { border-right: 3px solid var(--sat); }
        .table-row[data-day="sun"] { border-right: 3px solid var(--sun); }
        .table-row[data-day="mon"] { border-right: 3px solid var(--mon); }
        .table-row[data-day="tue"] { border-right: 3px solid var(--tue); }
        .table-row[data-day="wed"] { border-right: 3px solid var(--wed); }
        .table-row[data-day="thu"] { border-right: 3px solid var(--thu); }
        .table-row[data-day="fri"] { border-right: 3px solid var(--fri); }

        .table-row[data-day="sat"] .day-name { color: var(--sat); }
        .table-row[data-day="sun"] .day-name { color: var(--sun); }
        .table-row[data-day="mon"] .day-name { color: var(--mon); }
        .table-row[data-day="tue"] .day-name { color: var(--tue); }
        .table-row[data-day="wed"] .day-name { color: var(--wed); }
        .table-row[data-day="thu"] .day-name { color: var(--thu); }
        .table-row[data-day="fri"] .day-name { color: var(--fri); }

        /* ستون رها کردن تسک‌ها */
        .content-column {
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 100px;
            transition: background 0.2s ease;
        }

        /* افکت هاور شدن تسک روی روز */
        .content-column.drag-over {
            background: #111;
        }

        /* آیتم قابل کشیدن */
        .task-slot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: #0d0d0d;
            border: 1px solid #141414;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s, opacity 0.1s;
        }

        .task-slot:active {
            cursor: grabbing;
        }

        .task-slot.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            pointer-events: none; /* جلوگیری از اختلال در درگ */
        }

        .task-time {
            font-size: 0.9rem;
            font-family: monospace;
            color: var(--text-muted);
            min-width: 50px;
        }

        .task-title {
            font-size: 0.95rem;
            font-weight: 400;
        }

        .btn-erase {
            background: transparent;
            border: none;
            color: #333;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .task-slot:hover .btn-erase {
            color: #ef4444;
        }

        .empty-row-text {
            font-size: 0.85rem;
            color: #222;
            font-weight: 300;
            font-style: italic;
            pointer-events: none;
        }

        /* داک فرم پایینی */
        .dock-panel {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            max-width: 900px;
            width: calc(100% - 4rem);
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid #222;
            padding: 1.25rem 2rem;
            border-radius: 6px;
            z-index: 100;
        }

        .dock-form {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .dock-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #222;
            color: #fff;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            outline: none;
            flex-grow: 1;
        }

        .dock-input:focus {
            border-bottom-color: #fff;
        }

        #taskTime { max-width: 110px; }
        select.dock-input { color: #aaa; cursor: pointer; max-width: 140px; }

        .btn-submit {
            background: #fff;
            color: #000;
            border: none;
            padding: 0.6rem 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .table-row { grid-template-columns: 1fr; }
            .day-column { padding: 1rem 1.5rem; border-left: none; border-bottom: 1px solid var(--border-dim); }
            .content-column { padding: 1rem 1.5rem; min-height: auto; }
            .dock-form { flex-direction: column; gap: 1rem; align-items: stretch; }
            #taskTime, select.dock-input { max-width: 100%; }
            body { padding-bottom: 18rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="timeline-table">
            <div class="table-row" data-day="sat">
                <div class="day-column"><span class="day-name">شنبه</span></div>
                <div class="content-column" id="cell-sat"></div>
            </div>
            <div class="table-row" data-day="sun">
                <div class="day-column"><span class="day-name">یکشنبه</span></div>
                <div class="content-column" id="cell-sun"></div>
            </div>
            <div class="table-row" data-day="mon">
                <div class="day-column"><span class="day-name">دوشنبه</span></div>
                <div class="content-column" id="cell-mon"></div>
            </div>
            <div class="table-row" data-day="tue">
                <div class="day-column"><span class="day-name">سه‌شنبه</span></div>
                <div class="content-column" id="cell-tue"></div>
            </div>
            <div class="table-row" data-day="wed">
                <div class="day-column"><span class="day-name">چهارشنبه</span></div>
                <div class="content-column" id="cell-wed"></div>
            </div>
            <div class="table-row" data-day="thu">
                <div class="day-column"><span class="day-name">پنجشنبه</span></div>
                <div class="content-column" id="cell-thu"></div>
            </div>
            <div class="table-row" data-day="fri">
                <div class="day-column"><span class="day-name">جمعه</span></div>
                <div class="content-column" id="cell-fri"></div>
            </div>
        </div>

        <div class="dock-panel">
            <form id="matrixForm" class="dock-form">
                <input type="text" id="taskName" class="dock-input" placeholder="عنوان کار جدید..." required autocomplete="off">
                <input type="text" id="taskTime" class="dock-input" placeholder="زمان (مثلا ۱۲:۳۰)" required autocomplete="off">
                <select id="taskDay" class="dock-input">
                    <option value="sat">شنبه</option>
                    <option value="sun">یکشنبه</option>
                    <option value="mon">دوشنبه</option>
                    <option value="tue">سه‌شنبه</option>
                    <option value="wed">چهارشنبه</option>
                    <option value="thu">پنجشنبه</option>
                    <option value="fri">جمعه</option>
                </select>
                <button type="submit" class="btn-submit">اضافه کردن</button>
            </form>
        </div>

    </div>

    <script>
        const storageKey = 'drag_spectrum_v7';
        let database = JSON.parse(localStorage.getItem(storageKey)) || [];

        function renderTable() {
            const days = ['sat', 'sun', 'mon', 'tue', 'wed', 'thu', 'fri'];
            days.forEach(day => document.getElementById(`cell-${day}`).innerHTML = '');

            // مرتب‌سازی بر اساس ساعت
            database.sort((a, b) => a.time.localeCompare(b.time));

            database.forEach((task, index) => {
                const targetCell = document.getElementById(`cell-${task.day}`);
                if (targetCell) {
                    const html = `
                        <div class="task-slot" draggable="true" data-index="${index}">
                            <div class="task-left">
                                <span class="task-time">${task.time}</span>
                                <span class="task-title">${task.name}</span>
                            </div>
                            <button class="btn-erase" onclick="removeTask(${index}); event.stopPropagation();">✕</button>
                        </div>
                    `;
                    targetCell.insertAdjacentHTML('beforeend', html);
                }
            });

            days.forEach(day => {
                const targetCell = document.getElementById(`cell-${day}`);
                if (targetCell.innerHTML === '') {
                    targetCell.innerHTML = '<span class="empty-row-text">// بدون رویداد</span>';
                }
            });

            initDragAndDrop();
        }

        // منطق اصلی کشیدن و رها کردن کلاسیار
        function initDragAndDrop() {
            const slots = document.querySelectorAll('.task-slot');
            const columns = document.querySelectorAll('.content-column');

            slots.forEach(slot => {
                slot.addEventListener('dragstart', () => slot.classList.add('dragging'));
                slot.addEventListener('dragend', () => slot.classList.remove('dragging'));
            });

            columns.forEach(column => {
                column.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    column.classList.add('drag-over');
                });

                column.addEventListener('dragleave', () => column.classList.remove('drag-over'));

                column.addEventListener('drop', (e) => {
                    e.preventDefault();
                    column.classList.remove('drag-over');
                    
                    const draggingSlot = document.querySelector('.task-slot.dragging');
                    if (!draggingSlot) return;

                    const taskIndex = draggingSlot.getAttribute('data-index');
                    const targetDay = column.id.replace('cell-', '');

                    // تغییر روز آبجکت و آپدیت لوکال استوریج
                    database[taskIndex].day = targetDay;
                    localStorage.setItem(storageKey, JSON.stringify(database));
                    renderTable();
                });
            });
        }

        document.getElementById('matrixForm').addEventListener('submit', function(e) {
            e.preventDefault();
            database.push({
                name: document.getElementById('taskName').value,
                time: document.getElementById('taskTime').value,
                day: document.getElementById('taskDay').value
            });
            localStorage.setItem(storageKey, JSON.stringify(database));
            this.reset();
            renderTable();
        });

        function removeTask(index) {
            database.splice(index, 1);
            localStorage.setItem(storageKey, JSON.stringify(database));
            renderTable();
        }

        renderTable();
    </script>
</body>
</html>
